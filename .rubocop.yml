plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2.2
  Exclude:
    - "vendor/**/*"
    - ".git/**/*"
    - "tmp/**/*"
    - "bin/**/*"
Style/Documentation:
  Enabled: false
Style/HashSyntax:
  Enabled: false
Style/RegexpLiteral:
  EnforcedStyle: slashes
  AllowInnerSlashes: true
Style/OpenStructUse:
  Enabled: false
Style/HashEachMethods:
  Enabled: true
Style/HashTransformKeys:
  Enabled: true
Style/HashTransformValues:
  Enabled: true
Style/FrozenStringLiteralComment:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/RedundantConstantBase:
  Enabled: false
Layout/IndentationStyle:
  Enabled: true
Layout/CaseIndentation:
  IndentOneStep: true
Layout/LineLength:
  Max: 120
Layout/DotPosition:
  EnforcedStyle: trailing
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented_relative_to_receiver
Layout/IndentationWidth:
  Enabled: true
  Width: 2
Layout/FirstArrayElementIndentation:
  IndentationWidth: 2
Layout/FirstHashElementIndentation:
  IndentationWidth: 2
Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent
  IndentationWidth: 2
Metrics/ClassLength:
  Max: 250
Metrics/MethodLength:
  Max: 30
Metrics/AbcSize:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Lint/EmptyClass:
  Enabled: true
  AllowComments: true
RSpec/MultipleExpectations:
  Enabled: false
RSpec/NestedGroups:
  Max: 5
RSpec/MultipleMemoizedHelpers:
  Enabled: false
RSpec/IndexedLet:
  Enabled: false
RSpec/SpecFilePathFormat:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/AnyInstance:
  Enabled: false
